# Sweep run 2026-11-14: epoch scale-up of the 20-epoch cloud config
# (small_transformer_cloud.yaml). Identical hyperparameters; only epochs
# 20 -> 40 and patience 4 -> 8, so the run can use the extra epochs if the
# val curve is still rising.
model:
  d_model: 128
  n_layers: 4
  n_heads: 8
  d_ff: 256
  dropout: 0.1
  pooling: mean
  max_len: 1000

training:
  epochs: 40
  batch_size: 64
  grad_accum_steps: 1
  precision: bf16
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  patience: 8
  seed: 42
  grad_clip: 1.0
