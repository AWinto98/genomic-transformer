# Multi-seed replicate of sweep run 004 (small_transformer_cloud-004_d256.yaml),
# 2026-11-14. Identical config; only seed differs (42 -> 43) for a 3-seed
# comparison of the sweep winner (d_model 256, d_ff 512, batch 64, bf16,
# lr 3e-4, epochs 40, patience 8).
model:
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 512
  dropout: 0.1
  pooling: mean
  max_len: 1000

training:
  epochs: 40
  batch_size: 64
  grad_accum_steps: 1
  precision: bf16
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  patience: 8
  seed: 43
  grad_clip: 1.0
