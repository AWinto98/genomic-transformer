# JUND small-data recipe sweep 2026-11-14
# Arm 1: smaller model (d_model 256 -> 128, d_ff 512 -> 256; n_layers 4,
# n_heads 8, dropout 0.1, mean pooling, max_len 1000 unchanged) + gentler
# schedule for JUND's tiny 13,592-window train set (213 steps/epoch at batch
# 64): lr 3.0e-4 -> 1.0e-4, warmup_steps 500 -> 100 (0.5 epoch, was 2.3),
# epochs 40 -> 60, patience 8 -> 10. Base: small_transformer_cloud-004_d256.yaml.
model:
  d_model: 128
  n_layers: 4
  n_heads: 8
  d_ff: 256
  dropout: 0.1
  pooling: mean
  max_len: 1000

training:
  epochs: 60
  batch_size: 64
  grad_accum_steps: 1
  precision: bf16
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  patience: 10
  seed: 42
  grad_clip: 1.0
