# JunD diagnostic sweep 2026-11-14: d256 winner (small_transformer_cloud-004_d256)
# with epochs/patience raised 40/8 -> 60/60 so runs early-stopped mid-learning
# (212 steps/epoch) get a full budget; from-scratch arm at lr 1e-3 (vs the 3e-4
# that sat at the ln2 saddle), seed 42.
model:
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 512
  dropout: 0.1
  pooling: mean
  max_len: 1000

training:
  epochs: 60
  batch_size: 64
  grad_accum_steps: 1
  precision: bf16
  lr: 0.001
  weight_decay: 0.01
  warmup_steps: 500
  patience: 60
  seed: 42
  grad_clip: 1.0
