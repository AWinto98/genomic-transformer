# Sweep run 2026-11-14: capacity sweep of the cloud config
# (small_transformer_cloud.yaml). Wider model: d_model 128 -> 256, d_ff 256
# -> 512 (n_heads 8, n_layers 4, dropout 0.1, mean pooling, max_len 1000
# unchanged), plus the epoch scale-up (epochs 20 -> 40, patience 4 -> 8).
model:
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 512
  dropout: 0.1
  pooling: mean
  max_len: 1000

training:
  epochs: 40
  batch_size: 64
  grad_accum_steps: 1
  precision: bf16
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  patience: 8
  seed: 42
  grad_clip: 1.0
